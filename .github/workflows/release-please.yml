name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    # When this job merges a release PR, it pushes a tag (vX.Y.Z).
    # That tag push triggers release.yml, which builds the collection
    # artifact and publishes the GitHub Release.
